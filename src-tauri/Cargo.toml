[package]
name = "stenollama"
version = "0.1.0"
description = "A local-first stenopad: capture, transcribe, and distill."
edition = "2021"

[lib]
name = "stenollama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls avoids an OpenSSL system dependency on every platform.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
